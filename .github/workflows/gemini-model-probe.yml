name: Gemini Model Probe (temporary)

# 일회용 진단: 실제 아침과 같은 프롬프트로 Gemini 모델들을 호출해본다.
# 텔레그램 발송 없음. 확인이 끝나면 이 파일은 삭제한다.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 경제뉴스
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: Probe models with the real prompt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -W ignore - <<'EOF'
          import os, time
          import google.generativeai as genai
          from scripts.main import collect_candidates
          from scripts.news_sources import SOURCES
          from scripts import state_store
          from scripts.curator import _build_prompt
          c, _ = collect_candidates(SOURCES)
          n = state_store.filter_unsent(c, state_store.load_sent_urls("state.json"))
          prompt = _build_prompt(n)
          print(f"candidates={len(n)} prompt_chars={len(prompt)}")
          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          for name in ["gemini-3.6-flash", "gemini-3.6-flash", "gemini-3.8-flash", "gemini-3.5-flash", "gemini-flash-latest"]:
              t = time.time()
              try:
                  r = genai.GenerativeModel(name).generate_content(prompt)
                  print(f"PROBE OK    {name} {time.time()-t:.0f}s len={len(r.text or '')}")
              except Exception as e:
                  print(f"PROBE FAIL  {name} {time.time()-t:.0f}s {str(e).splitlines()[0][:100]}")
                  for line in str(e).splitlines():
                      if "quota_id" in line or "quota_value" in line:
                          print("    ", line.strip())
              time.sleep(15)
          EOF
