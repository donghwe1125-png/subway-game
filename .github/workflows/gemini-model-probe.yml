name: Gemini Model Probe (temporary)

# 일회용 진단: 실제 후보로 curator를 돌려 고른 기사를 출력만 한다. 텔레그램 발송 없음.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 경제뉴스
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: Probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -W ignore - <<'EOF'
          import os
          from scripts.main import collect_candidates
          from scripts.news_sources import SOURCES
          from scripts import state_store
          from scripts.curator import select_and_explain
          c, _ = collect_candidates(SOURCES)
          n = state_store.filter_unsent(c, state_store.load_sent_urls("state.json"))
          items = select_and_explain(n, os.environ["GEMINI_API_KEY"], model_names=("gemini-3.5-flash-lite",))
          print(f"PROBE items={len(items)}")
          for it in items:
              print(f"PROBE {it.source_name} | {it.title_kr} | {it.url} | {len(it.what_happened)}+{len(it.why_it_matters)} chars")
          EOF
