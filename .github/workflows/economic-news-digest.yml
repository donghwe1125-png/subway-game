name: Economic News Digest

on:
  schedule:
    # 목표 발송 시각은 07:00 KST. GitHub의 예약 실행은 "정시"(00분)에 전 세계
    # 요청이 몰려 2~4시간씩 밀리므로, 애매한 분으로 19분 이르게 깨운다.
    # 실제 발송은 scripts/main.py가 07:00 KST까지 기다렸다가 수행한다.
    #
    # 트리거를 여러 개 두면 둘이 동시에 대기하다 양쪽 다 발송할 수 있다
    # (먼저 깨어난 쪽이 아직 state.json에 기록을 남기기 전이라 중복 검사를
    # 통과해버린다). 그래서 예약은 하나만 둔다.
    - cron: '41 21 * * *'  # 06:41 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 경제뉴스

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 예약 실행만 07:00 KST까지 대기하고 하루 한 번으로 제한된다.
          # 수동 실행은 즉시 발송한다.
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' }}
        run: python -m scripts.main

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update economic news state [skip ci]"
            git push
          fi
