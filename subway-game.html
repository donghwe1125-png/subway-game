<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지하철 게임 🚇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: #111827;
            color: #f3f4f6;
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.9em; margin-bottom: 4px; text-align: center; }
        .subtitle { color: #6b7280; font-size: 0.85em; margin-bottom: 24px; text-align: center; }
        #app { width: 100%; max-width: 560px; }

        .btn { padding: 11px 20px; border: none; border-radius: 9px; cursor: pointer; font-size: 0.95em; font-weight: 600; transition: opacity 0.15s; }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-ghost { background: #1f2937; color: #9ca3af; border: 1px solid #374151; }

        /* ── Setup ── */
        .card { background: #1f2937; border-radius: 16px; padding: 28px; }
        .card h2 { margin-bottom: 8px; }
        .card > p { color: #9ca3af; font-size: 0.85em; margin-bottom: 22px; }
        .counter-row { display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: 24px; }
        .count-btn { width: 42px; height: 42px; border-radius: 50%; border: none; background: #374151; color: white; font-size: 1.4em; cursor: pointer; }
        .count-num { font-size: 2.2em; font-weight: bold; min-width: 36px; text-align: center; }

        .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid #374151; }
        .setting-label { color: #d1d5db; font-size: 0.9em; }
        .toggle { width: 46px; height: 26px; background: #374151; border-radius: 13px; border: none; cursor: pointer; position: relative; transition: background 0.2s; flex-shrink: 0; }
        .toggle.on { background: #3b82f6; }
        .toggle::after { content: ''; position: absolute; width: 20px; height: 20px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: left 0.2s; }
        .toggle.on::after { left: 23px; }

        .timer-config { padding: 10px 0 4px; display: flex; align-items: center; gap: 12px; }
        .timer-config span { color: #9ca3af; font-size: 0.85em; white-space: nowrap; }
        .timer-slider { flex: 1; accent-color: #3b82f6; }
        .timer-val { font-weight: bold; color: #f3f4f6; min-width: 30px; text-align: right; font-size: 0.9em; }

        /* ── Line Select ── */
        .player-banner { padding: 14px; border-radius: 12px; text-align: center; font-size: 1.2em; font-weight: bold; margin-bottom: 14px; }
        .line-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
        .line-btn { padding: 16px 10px; border: none; border-radius: 11px; color: white; font-weight: bold; cursor: pointer; font-size: 0.95em; transition: transform 0.1s; }
        .line-btn:hover { transform: scale(1.05); }

        /* ── Playing ── */
        .line-bar { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #1f2937; border-radius: 12px; margin-bottom: 12px; }
        .line-dot { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8em; color: white; flex-shrink: 0; }
        .line-bar-name { font-size: 1.15em; font-weight: bold; }
        .line-bar-sub { font-size: 0.8em; color: #6b7280; margin-top: 2px; }

        .timer-wrap { height: 6px; background: #374151; border-radius: 3px; margin-bottom: 12px; overflow: hidden; }
        .timer-bar { height: 100%; border-radius: 3px; background: #3b82f6; transition: width 0.1s linear, background 0.3s; }
        .timer-bar.warn { background: #f59e0b; }
        .timer-bar.danger { background: #ef4444; }

        .err { color: #ef4444; text-align: center; min-height: 22px; font-size: 0.85em; margin-bottom: 8px; }
        .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .input-row input { flex: 1; padding: 13px 14px; background: #1f2937; border: 2px solid #374151; border-radius: 10px; color: #f3f4f6; font-size: 1em; transition: border-color 0.2s; }
        .input-row input:focus { outline: none; border-color: #3b82f6; }

        /* 환승 */
        .xfer-section { margin-bottom: 10px; }
        .xfer-toggle-btn { width: 100%; padding: 10px; background: #1f2937; border: 1px dashed #374151; border-radius: 10px; color: #9ca3af; cursor: pointer; font-size: 0.88em; transition: all 0.15s; }
        .xfer-toggle-btn:hover { border-color: #6b7280; color: #d1d5db; }
        .xfer-toggle-btn.active { border-color: #f59e0b; color: #f59e0b; background: #1c1a10; }
        .xfer-panel { margin-top: 10px; padding: 14px; background: #1f2937; border: 1px solid #374151; border-radius: 10px; }
        .xfer-panel p { font-size: 0.82em; color: #9ca3af; margin-bottom: 10px; }
        .xfer-line-grid { display: flex; flex-wrap: wrap; gap: 7px; }
        .xfer-line-btn { padding: 6px 12px; border: none; border-radius: 16px; color: white; font-weight: bold; cursor: pointer; font-size: 0.8em; opacity: 0.9; transition: transform 0.1s, opacity 0.1s; }
        .xfer-line-btn:hover { transform: scale(1.05); opacity: 1; }
        .xfer-line-btn.selected { outline: 3px solid white; outline-offset: 2px; }
        .xfer-selected-info { margin-top: 8px; font-size: 0.82em; color: #f59e0b; }

        .give-up-row { margin-bottom: 0; }

        /* ── Over ── */
        .over-card { background: #1f2937; border-radius: 16px; padding: 32px; text-align: center; }
        .over-card h2 { font-size: 2em; margin-bottom: 12px; }
        .over-loser { font-size: 1.2em; font-weight: bold; margin-bottom: 6px; }
        .over-beer { font-size: 1.5em; margin-bottom: 24px; }
        .over-history { text-align: left; margin-bottom: 24px; }
        .over-history .label { font-size: 0.82em; color: #6b7280; margin-bottom: 8px; }
        .history-box { background: #111827; border-radius: 10px; padding: 12px; max-height: 150px; overflow-y: auto; }
        .chip { display: inline-block; padding: 3px 9px; background: #374151; border-radius: 10px; font-size: 0.8em; margin: 2px; border-left: 3px solid transparent; }
    </style>
</head>

    '8호선': ['암사','천호','강동구청','몽촌토성','잠실','석촌','송파','가락시장','문정','장지','복정','산성','남한산성입구','단대오거리','신흥','수진','모란'],

    '공항철도': ['서울역','공덕','홍대입구','디지털미디어시티','마곡나루','김포공항','계양','검암','운서','공항화물청사','인천공항1터미널','인천공항2터미널'],
};

const LINE_SETS = {};
for (const [line, arr] of Object.entries(RAW_LINES)) {
    LINE_SETS[line] = new Set(arr);
}

// ── 게임 상태 ─────────────────────────────────────────────────────

function freshState(keep = {}) {
    return {
        phase: 'setup',
        playerCount: keep.playerCount ?? 2,
        timerEnabled: keep.timerEnabled ?? false,
        timerDuration: keep.timerDuration ?? 10,
        currentPlayer: 0,
        currentLine: null,
        usedStations: new Set(),
        history: [],
        loser: null,
        pendingXferLine: null,   // 환승 신청 시 선택된 노선
        xferOpen: false,         // 환승 패널 열림 여부
        timeLeft: keep.timerDuration ?? 10,
    };
}

let S = freshState();

// ── 타이머 ────────────────────────────────────────────────────────

let timerIv = null;

function stopTimer() { clearInterval(timerIv); timerIv = null; }

function startTimer() {
    stopTimer();
    if (!S.timerEnabled) return;
    S.timeLeft = S.timerDuration;
    drawTimer();
    timerIv = setInterval(() => {
        S.timeLeft = Math.max(0, S.timeLeft - 0.1);
        drawTimer();
        if (S.timeLeft <= 0) { stopTimer(); endGame(S.currentPlayer); }
    }, 100);
}

function drawTimer() {
    const bar = document.getElementById('timerBar');
    if (!bar) return;
    const pct = (S.timeLeft / S.timerDuration) * 100;
    bar.style.width = pct + '%';
    bar.className = 'timer-bar' + (pct < 30 ? ' danger' : pct < 55 ? ' warn' : '');
}

// ── 로직 ──────────────────────────────────────────────────────────

function selectLine(line) {
    S.currentLine = line;
    S.phase = 'playing';
    S.currentPlayer = 1 % S.playerCount;
    startTimer();
    render();
}

function submitStation(raw) {
    const st = raw.trim().replace(/역$/, '');
    if (!st) return;
    clearErr();

    // 현재 노선 검증
    if (!LINE_SETS[S.currentLine].has(st)) {
        return setErr(`"${st}"은(는) ${S.currentLine}에 없는 역이에요!`);
    }
    if (S.usedStations.has(st)) {
        return setErr(`"${st}"은(는) 이미 나온 역이에요!`);
    }

    // 환승 신청 시: 해당 역이 목표 노선에도 있는지 확인
    if (S.pendingXferLine) {
        if (!LINE_SETS[S.pendingXferLine].has(st)) {
            return setErr(`"${st}"은(는) ${S.pendingXferLine}에 없는 역이에요!`);
        }
        // 환승 성공
        stopTimer();
        S.usedStations.add(st);
        S.history.push({ station: st, player: S.currentPlayer, line: S.currentLine, xferTo: S.pendingXferLine });
        S.currentLine = S.pendingXferLine;
        nextTurn();
        return;
    }

    // 일반 제출
    stopTimer();
    S.usedStations.add(st);
    S.history.push({ station: st, player: S.currentPlayer, line: S.currentLine });
    nextTurn();
}

function nextTurn() {
    S.currentPlayer = (S.currentPlayer + 1) % S.playerCount;
    S.pendingXferLine = null;
    S.xferOpen = false;
    startTimer();
    render();
}

function giveUp() { stopTimer(); endGame(S.currentPlayer); }

function endGame(loserIdx) {
    stopTimer();
    S.loser = loserIdx;
    S.phase = 'over';
    render();
}

// ── 유틸 ──────────────────────────────────────────────────────────

let errTm;
function setErr(msg) {
    const el = document.getElementById('err');
    if (el) el.textContent = msg;
    clearTimeout(errTm);
    errTm = setTimeout(clearErr, 2800);
}
function clearErr() { const el = document.getElementById('err'); if (el) el.textContent = ''; }

function pName(i) { return `플레이어 ${i + 1}`; }
function pColor(i) { return PLAYER_COLORS[i % PLAYER_COLORS.length]; }

function dotHTML(line, size = 38) {
    const c = LINE_COLORS[line] || '#888';
    const label = line
        .replace('수인분당선','분당').replace('경의중앙선','경의중')
        .replace('경춘선','경춘').replace('신분당선','신분당')
        .replace('공항철도','공항').replace('호선','');
    return `<div class="line-dot" style="background:${c};width:${size}px;height:${size}px">${label}</div>`;
}

// ── 렌더 ──────────────────────────────────────────────────────────

function render() {
    const app = document.getElementById('app');
    if      (S.phase === 'setup')       app.innerHTML = tmplSetup();
    else if (S.phase === 'line-select') app.innerHTML = tmplLineSelect();
    else if (S.phase === 'playing')     app.innerHTML = tmplPlaying();
    else if (S.phase === 'over')        app.innerHTML = tmplOver();
    wire();
}

function tmplSetup() {
    return `<div class="card" style="text-align:center">
        <h2 style="margin-bottom:8px">🚇 지하철 게임</h2>
        <p>몇 명이서 플레이할까요?</p>
        <div class="counter-row">
            <button class="count-btn" id="dec">−</button>
            <div class="count-num" id="cnt">${S.playerCount}</div>
            <button class="count-btn" id="inc">+</button>
        </div>
        <div class="setting-row">
            <span class="setting-label">⏱ 제한시간</span>
            <button class="toggle ${S.timerEnabled ? 'on' : ''}" id="timerToggle"></button>
        </div>
        <div id="timerConfigWrap" style="${S.timerEnabled ? '' : 'display:none'}">
            <div class="timer-config">
                <span>5초</span>
                <input class="timer-slider" type="range" id="timerSlider" min="5" max="60" step="5" value="${S.timerDuration}">
                <span>60초</span>
                <span class="timer-val" id="timerVal">${S.timerDuration}초</span>
            </div>
        </div>
        <div style="margin-top:20px">
            <button class="btn btn-primary" id="goSetup" style="width:100%;padding:14px;font-size:1em">게임 시작</button>
        </div>
    </div>`;
}

function tmplLineSelect() {
    const lines = Object.keys(LINE_COLORS);
    return `
    <div class="player-banner" style="background:${pColor(0)}">${pName(0)} — 노선을 선택하세요!</div>
    <p style="text-align:center;color:#6b7280;font-size:0.82em;margin-bottom:4px">선택한 노선의 역을 돌아가며 말합니다</p>
    <div class="line-grid">
        ${lines.map(l => `<button class="line-btn" style="background:${LINE_COLORS[l]}" data-line="${l}">${l}<br><span style="font-size:0.75em;opacity:0.85">${RAW_LINES[l].length}개 역</span></button>`).join('')}
    </div>`;
}

function tmplPlaying() {
    const p = S.currentPlayer;
    const otherLines = Object.keys(LINE_COLORS).filter(l => l !== S.currentLine);
    return `
    <div class="player-banner" style="background:${pColor(p)}">${pName(p)}의 차례</div>
    <div class="line-bar">
        ${dotHTML(S.currentLine)}
        <div>
            <div class="line-bar-name">${S.currentLine}</div>
            <div class="line-bar-sub">${RAW_LINES[S.currentLine].length}개 역</div>
        </div>
    </div>
    ${S.timerEnabled ? `<div class="timer-wrap"><div class="timer-bar" id="timerBar" style="width:100%"></div></div>` : ''}
    <div class="err" id="err"></div>
    <div class="input-row">
        <input id="stInp" type="text" placeholder="역 이름 입력..." autofocus autocomplete="off">
        <button class="btn btn-primary" id="submitBtn">확인</button>
    </div>

    <div class="xfer-section">
        <button class="xfer-toggle-btn ${S.xferOpen ? 'active' : ''}" id="xferToggleBtn">
            ${S.xferOpen ? '🔁 환승 신청 중 (취소하려면 클릭)' : '🔁 환승 신청'}
        </button>
        ${S.xferOpen ? `
        <div class="xfer-panel">
            <p>환승할 노선을 고른 뒤 해당 역 이름을 입력하고 확인하세요.</p>
            <div class="xfer-line-grid">
                ${otherLines.map(l => `
                    <button class="xfer-line-btn ${S.pendingXferLine === l ? 'selected' : ''}"
                        style="background:${LINE_COLORS[l]}" data-xfer="${l}">${l}</button>
                `).join('')}
            </div>
            ${S.pendingXferLine ? `<div class="xfer-selected-info">→ ${S.pendingXferLine}으로 환승 예정</div>` : ''}
        </div>` : ''}
    </div>

    <div style="margin-top:10px">
        <button class="btn btn-ghost" id="giveUpBtn" style="width:100%">😵 못 하겠어요 (패배 인정)</button>
    </div>`;
}

function tmplOver() {
    const li = S.loser;
    return `
    <div class="over-card">
        <h2>🍺 게임 종료!</h2>
        <div class="over-loser" style="color:${pColor(li)}">${pName(li)} 패배!</div>
        <div class="over-beer">${pName(li)}은(는) 술 마세요 🍺🍺🍺</div>
        <div class="over-history">
            <div class="label">역 기록 — 총 ${S.history.length}개</div>
            <div class="history-box">
                ${S.history.length
                    ? S.history.map(h =>
                        `<span class="chip" style="border-left-color:${pColor(h.player)}" title="${pName(h.player)}">${h.station}${h.xferTo ? ` →${h.xferTo}` : ''}</span>`
                      ).join(' ')
                    : '<span style="color:#6b7280">아무 역도 나오지 않았어요</span>'
                }
            </div>
        </div>
        <button class="btn btn-primary" id="restartBtn" style="width:100%;padding:14px;font-size:1em">다시 하기</button>
    </div>`;
}

// ── 이벤트 ────────────────────────────────────────────────────────

function wire() {
    // Setup
    const dec = document.getElementById('dec');
    const inc = document.getElementById('inc');
    const cnt = document.getElementById('cnt');
    const tt  = document.getElementById('timerToggle');
    const sl  = document.getElementById('timerSlider');
    const tv  = document.getElementById('timerVal');
    const go  = document.getElementById('goSetup');
    if (dec) dec.onclick = () => { if (S.playerCount > 2) { S.playerCount--; cnt.textContent = S.playerCount; } };
    if (inc) inc.onclick = () => { if (S.playerCount < 6) { S.playerCount++; cnt.textContent = S.playerCount; } };
    if (tt)  tt.onclick  = () => {
        S.timerEnabled = !S.timerEnabled;
        tt.className = 'toggle' + (S.timerEnabled ? ' on' : '');
        document.getElementById('timerConfigWrap').style.display = S.timerEnabled ? '' : 'none';
    };
    if (sl)  sl.oninput  = () => { S.timerDuration = +sl.value; tv.textContent = sl.value + '초'; };
    if (go)  go.onclick  = () => { S.phase = 'line-select'; render(); };

    // Line select
    document.querySelectorAll('[data-line]').forEach(b => { b.onclick = () => selectLine(b.dataset.line); });

    // Playing
    const inp = document.getElementById('stInp');
    const sub = document.getElementById('submitBtn');
    const gu  = document.getElementById('giveUpBtn');
    const xt  = document.getElementById('xferToggleBtn');
    if (inp) {
        inp.focus();
        inp.onkeydown = e => { if (e.key === 'Enter') { submitStation(inp.value); inp.value = ''; } };
    }
    if (sub) sub.onclick = () => {
        const i = document.getElementById('stInp');
        if (i) { submitStation(i.value); i.value = ''; }
    };
    if (gu) gu.onclick = giveUp;
    if (xt) xt.onclick = () => {
        S.xferOpen = !S.xferOpen;
        if (!S.xferOpen) S.pendingXferLine = null;
        render();
        const i = document.getElementById('stInp');
        if (i) i.focus();
    };

    // 환승 노선 선택
    document.querySelectorAll('[data-xfer]').forEach(b => {
        b.onclick = () => {
            S.pendingXferLine = b.dataset.xfer;
            render();
            const i = document.getElementById('stInp');
            if (i) i.focus();
        };
    });

    // Restart
    const rb = document.getElementById('restartBtn');
    if (rb) rb.onclick = () => {
        stopTimer();
        S = freshState({ playerCount: S.playerCount, timerEnabled: S.timerEnabled, timerDuration: S.timerDuration });
        render();
    };

    if (S.phase === 'playing' && S.timerEnabled && timerIv) drawTimer();
}

render();
</script>
</body>
</html>
